name: cd

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required for peaceiris/actions-gh-pages

jobs:
  cd:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: pnpm run generate
        env:
          BASE_URL: /
          NODE_ENV: production
          G_API_KEY: ${{ secrets.G_API_KEY }}
          G_APP_ID: ${{ secrets.G_APP_ID }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: bgc.jasonsuttles.dev

      - name: Deploy database rules to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_3AE94 }}' > /tmp/sa.json
          npx firebase-tools@latest deploy --only database --project board-game-calendar-3ae94
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Deploy functions to Firebase
        run: |
          npx firebase-tools@latest deploy --only functions --project board-game-calendar-3ae94
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
